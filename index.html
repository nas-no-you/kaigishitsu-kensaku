<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会議室 空き検索</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1a1d21;--mut:#667085;--ac:#1d6fb8;--acbg:#e6f0fa;--ok:#2e7d32;--okbg:#e5f4e6;--bd:#dde1e7;--hol:#d93a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121518;--card:#1c2025;--tx:#e8eaed;--mut:#9aa3ad;--ac:#6db3f2;--acbg:#1d3246;--ok:#7bd17f;--okbg:#1f3322;--bd:#2d333a;--hol:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121518;--card:#1c2025;--tx:#e8eaed;--mut:#9aa3ad;--ac:#6db3f2;--acbg:#1d3246;--ok:#7bd17f;--okbg:#1f3322;--bd:#2d333a;--hol:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--mut);margin:10px 0 4px}.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.chip.pre{font-size:12px;padding:4px 10px;color:var(--mut)}
.presets{margin-top:6px}
.row{display:flex;gap:8px;align-items:center}
input,select{flex:1;min-width:0;width:100%;font:inherit;font-size:15px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.day{margin:8px 0}
.day>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.day>summary::-webkit-details-marker{display:none}
.day>summary::after{content:"▸";color:var(--mut)}
.day[open]>summary::after{content:"▾"}
.day>summary small{font-weight:400;color:var(--mut);margin-left:8px;font-size:12px}
.day.hol>summary span.t{color:var(--hol)}
.day[open]>summary{margin-bottom:6px}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:4px 0}
.item{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.hall{font-size:15px;font-weight:600}
.room{margin-top:6px;font-size:13px}
.badges{margin-top:3px;display:flex;flex-wrap:wrap;gap:5px}
.b{background:var(--okbg);color:var(--ok);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.b.tel{background:var(--acbg);color:var(--ac)}
.empty,.err{text-align:center;color:var(--mut);padding:30px 0}
.count{font-size:13px;color:var(--mut);margin:4px 2px}
.more{display:block;width:100%;margin:12px 0;padding:12px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
  <h1>会議室 空き検索</h1>
  <div class="sub" id="updated"></div>
  <div class="panel">
    <div class="lbl">区</div>
    <div class="chips">
      <button class="chip on" disabled>品川区</button>
      <button class="chip" disabled>目黒区(準備中)</button>
      <button class="chip" disabled>大田区(準備中)</button>
      <button class="chip" disabled>渋谷区(準備中)</button>
    </div>
    <div class="lbl">期間</div>
    <div class="row"><input type="date" id="from"><span>〜</span><input type="date" id="to"></div>
    <div class="lbl">曜日(「祝」は祝日)</div>
    <div class="chips" id="dow"></div>
    <div class="chips presets" id="presets"></div>
    <div class="lbl">時間帯</div>
    <div class="chips" id="slot"></div>
    <div class="lbl">施設名で探す</div>
    <input type="search" id="q" placeholder="例:荏原、文化センター">
    <div class="lbl">館</div>
    <select id="hall"></select>
    <div class="lbl">オプション</div>
    <div class="chips">
      <button class="chip" id="school">学校施設を含める</button>
      <button class="chip" id="online">オンライン予約可のみ</button>
    </div>
  </div>
  <div class="tools"><button class="chip" id="openall">すべて開く</button><button class="chip" id="closeall">すべて閉じる</button></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script>
const SL=["午前","午後","夜間"],DW=["日","月","火","水","木","金","土"];
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const tm=t=>t.replace(/(\d+)時(\d+)分～(\d+)時(\d+)分/,(a,h1,m1,h2,m2)=>`${+h1}:${m1}–${+h2}:${m2}`);
const isSchool=h=>/(学校|学園)$/.test(h);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const HC={};
function holidays(y){
  if(HC[y])return HC[y];
  const s=new Set(),p=n=>String(n).padStart(2,"0");
  const add=(m,d)=>s.add(y+"-"+p(m)+"-"+p(d));
  const nth=(m,n)=>{const f=new Date(y,m-1,1).getDay();return 1+((8-f)%7)+(n-1)*7};
  add(1,1);add(1,nth(1,2));add(2,11);add(2,23);
  add(3,Math.floor(20.8431+0.242194*(y-1980))-Math.floor((y-1980)/4));
  add(4,29);add(5,3);add(5,4);add(5,5);add(7,nth(7,3));add(8,11);add(9,nth(9,3));
  add(9,Math.floor(23.2488+0.242194*(y-1980))-Math.floor((y-1980)/4));
  add(10,nth(10,2));add(11,3);add(11,23);
  const base=new Set(s);
  for(let d=new Date(y,0,1);d.getFullYear()===y;d.setDate(d.getDate()+1)){
    const k=ymd(d);
    if(base.has(k)&&d.getDay()===0){
      const n=new Date(d);
      do{n.setDate(n.getDate()+1)}while(base.has(ymd(n)));
      if(n.getFullYear()===y)s.add(ymd(n));
    }else if(!base.has(k)&&d.getDay()!==0){
      const a=new Date(d),b=new Date(d);a.setDate(a.getDate()-1);b.setDate(b.getDate()+1);
      if(base.has(ymd(a))&&base.has(ymd(b)))s.add(k);
    }
  }
  return HC[y]=s;
}
const isHol=d=>holidays(+d.slice(0,4)).has(d);

const st={from:"",to:"",dow:new Set([0,1,2,3,4,5,6,7]),slot:new Set(SL),q:"",hall:"",school:false,online:false,limit:7};
let DATA=[];
const opened=new Set();
const DOWS=[1,2,3,4,5,6,0,7];
const dowLabel=v=>v===7?"祝":DW[v];
const PRESETS=[["全て",[0,1,2,3,4,5,6,7]],["土日祝",[6,0,7]],["平日",[1,2,3,4,5]],["祝日のみ",[7]]];

function buildDow(){
  const el=document.getElementById("dow");
  el.innerHTML="";
  DOWS.forEach(v=>{
    const b=document.createElement("button");
    b.className="chip"+(st.dow.has(v)?" on":"");
    b.textContent=dowLabel(v);
    b.onclick=()=>{st.dow.has(v)?st.dow.delete(v):st.dow.add(v);b.classList.toggle("on",st.dow.has(v));st.limit=7;render()};
    el.appendChild(b);
  });
}
function buildPresets(){
  const el=document.getElementById("presets");
  PRESETS.forEach(([name,vals])=>{
    const b=document.createElement("button");
    b.className="chip pre";b.textContent=name;
    b.onclick=()=>{st.dow=new Set(vals);buildDow();st.limit=7;render()};
    el.appendChild(b);
  });
}
function chips(el,items,set,label){
  el.innerHTML="";
  items.forEach(v=>{const b=document.createElement("button");b.className="chip on";b.textContent=label(v);
    b.onclick=()=>{set.has(v)?set.delete(v):set.add(v);b.classList.toggle("on",set.has(v));st.limit=7;render()};el.appendChild(b)});
}
function fillHalls(){
  const sel=document.getElementById("hall");
  const hs=[...new Set(DATA.filter(x=>st.school||!isSchool(x.h)).map(x=>x.h))].sort((a,b)=>a.localeCompare(b,"ja"));
  if(st.hall&&!hs.includes(st.hall))st.hall="";
  sel.innerHTML='<option value="">すべての館</option>'+hs.map(h=>`<option${h===st.hall?" selected":""}>${esc(h)}</option>`).join("");
}
function dayOk(d){return isHol(d)?st.dow.has(7):st.dow.has(parse(d).getDay())}
function render(){
  const q=st.q.trim();
  const rows=DATA.filter(x=>(!st.from||x.d>=st.from)&&(!st.to||x.d<=st.to)
    &&dayOk(x.d)&&st.slot.has(x.s)
    &&(st.school||!isSchool(x.h))&&(!st.online||x.online)
    &&(!st.hall||x.h===st.hall)&&(!q||(x.h+x.r).includes(q)));
  const g={};
  rows.forEach(x=>{
    const H=(g[x.d]=g[x.d]||{});
    const h=(H[x.h]=H[x.h]||{url:x.url,rooms:{}});
    (h.rooms[x.r]=h.rooms[x.r]||[]).push(x);
  });
  const dates=Object.keys(g).sort();
  document.getElementById("count").textContent=dates.length?`空き ${rows.length} 枠(${dates.length}日)`:"";
  const list=document.getElementById("list");
  if(!dates.length){list.innerHTML='<div class="empty">条件に合う空きはありません</div>';return}
  const shown=dates.slice(0,st.limit);
  list.innerHTML=shown.map(d=>{
    const dt=parse(d),hol=isHol(d);
    const halls=Object.keys(g[d]).sort((a,b)=>a.localeCompare(b,"ja")).map(h=>{
      const o=g[d][h];
      const rooms=Object.keys(o.rooms).sort().map(r=>{
        const bs=o.rooms[r].sort((a,b)=>a.t.localeCompare(b.t)).map(x=>`<span class="b${x.online?"":" tel"}">${x.s} ${esc(tm(x.t))}${x.online?"":" ☎"}</span>`).join("");
        return `<div class="room">${esc(r)}<div class="badges">${bs}</div></div>`;
      }).join("");
      return `<a class="item" href="${esc(o.url)}" target="_blank" rel="noopener"><div class="hall">${esc(h)}</div>${rooms}</a>`;
    }).join("");
    const n=Object.values(g[d]).reduce((a,o)=>a+Object.values(o.rooms).reduce((b,v)=>b+v.length,0),0);
    return `<details class="day${hol?" hol":""}" data-d="${d}"${opened.has(d)?" open":""}><summary><span><span class="t">${dt.getMonth()+1}月${dt.getDate()}日(${DW[dt.getDay()]}${hol?"・祝":""})</span><small>${Object.keys(g[d]).le
