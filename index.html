:root{--bg:#f4f6f8;--card:#fff;--tx:#1a1d21;--mut:#667085;--ac:#1d6fb8;--acbg:#e6f0fa;--ok:#2e7d32;--okbg:#e5f4e6;--bd:#dde1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#121518;--card:#1c2025;--tx:#e8eaed;--mut:#9aa3ad;--ac:#6db3f2;--acbg:#1d3246;--ok:#7bd17f;--okbg:#1f3322;--bd:#2d333a;color-scheme:dark}
*{box-sizing:border-box}

.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.lbl{font-size:12px;color:var(--mut);margin:10px 0 4px}.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
input,select{flex:1;min-width:0;width:100%;font:inherit;font-size:15px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.day{margin:8px 0}
.day>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.day>summary::-webkit-details-marker{display:none}
.day>summary::after{content:"▸";color:var(--mut)}
.day[open]>summary::after{content:"▾"}
.day>summary small{font-weight:400;color:var(--mut);margin-left:8px;font-size:12px}
.day[open]>summary{margin-bottom:6px}
